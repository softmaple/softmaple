name: "Chromatic (awareness)"

on:
  push:
    branches:
      - main
      - next
    paths:
      - 'packages/awareness/**'
      - '!packages/awareness/**/*.test.ts'
      - '!packages/awareness/**/*.test.tsx'
      - '!packages/awareness/**/*.bench.ts'
      - '!packages/awareness/src/__tests__/**'
      - '!packages/awareness/coverage/**'
      - '!packages/awareness/**/*.md'
      - '.github/workflows/awareness-chromatic.yml'
      - '.github/workflows/_chromatic-reusable.yml'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - main
      - next
    paths:
      - 'packages/awareness/**'
      - '!packages/awareness/**/*.test.ts'
      - '!packages/awareness/**/*.test.tsx'
      - '!packages/awareness/**/*.bench.ts'
      - '!packages/awareness/src/__tests__/**'
      - '!packages/awareness/coverage/**'
      - '!packages/awareness/**/*.md'
      - '.github/workflows/awareness-chromatic.yml'
      - '.github/workflows/_chromatic-reusable.yml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  chromatic:
    # ⚠️ Requires the `CHROMATIC_PROJECT_TOKEN_AWARENESS` repository secret
    # (separate Chromatic project from packages/editor — one project per Storybook)
    uses: ./.github/workflows/_chromatic-reusable.yml
    with:
      working-dir: packages/awareness
    secrets:
      project-token: ${{ secrets.CHROMATIC_PROJECT_TOKEN_AWARENESS }}
