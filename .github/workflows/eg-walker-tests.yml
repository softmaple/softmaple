name: Eg-walker Package Tests

on:
  push:
    branches: [ main, next ]
    paths:
      - 'packages/eg-walker/**'
      - '.github/workflows/eg-walker-tests.yml'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [ main, next ]
    paths:
      - 'packages/eg-walker/**'
      - '.github/workflows/eg-walker-tests.yml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eg-walker package
        run: pnpm --filter @softmaple/eg-walker build

      - name: Run unit tests with coverage
        run: pnpm --filter @softmaple/eg-walker test:coverage
        env:
          CI: true

      - name: Report coverage to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: packages/eg-walker
