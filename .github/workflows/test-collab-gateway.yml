name: Collaboration Service Tests

on:
  push:
    branches: [main, next]
    paths:
      - 'apps/collab/**'
      - 'packages/collab-runtime/**'
      - 'apps/web/modules/docs/use-collab-document.ts'
      - 'apps/web/package.json'
      - 'apps/web/proxy.ts'
      - 'apps/web/proxy.test.ts'
      - 'apps/web/scripts/e2e-collab-router.mjs'
      - 'apps/web/playwright.config.ts'
      - 'vercel.json'
      - '.github/workflows/test-collab-gateway.yml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
  pull_request:
    branches: [main, next]
    paths:
      - 'apps/collab/**'
      - 'packages/collab-runtime/**'
      - 'apps/web/modules/docs/use-collab-document.ts'
      - 'apps/web/package.json'
      - 'apps/web/proxy.ts'
      - 'apps/web/proxy.test.ts'
      - 'apps/web/scripts/e2e-collab-router.mjs'
      - 'apps/web/playwright.config.ts'
      - 'vercel.json'
      - '.github/workflows/test-collab-gateway.yml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'

permissions:
  contents: read

jobs:
  test:
    name: Collab realtime and web routing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLAB_ALLOWED_ORIGINS: http://127.0.0.1:32110
      COLLAB_REALTIME_DRIVER: memory
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
      SUPABASE_URL: https://example.supabase.co
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Nitro collaboration backend
        run: |
          pnpm exec turbo run build --filter=@softmaple/collab... --filter=!@softmaple/collab
          pnpm --filter @softmaple/collab-runtime test
          pnpm --filter @softmaple/collab typecheck
          pnpm --filter @softmaple/collab test
          pnpm --filter @softmaple/collab build

      - name: Check Next.js host routing
        run: |
          pnpm exec turbo run build --filter=@softmaple/web... --filter=!@softmaple/web
          pnpm --filter @softmaple/web typecheck
          pnpm --filter @softmaple/web exec vitest run proxy.test.ts
          pnpm --filter @softmaple/web build
