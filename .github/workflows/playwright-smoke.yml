name: Chromium Smoke

on:
  pull_request:
    paths:
      - "apps/collab-nitro/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/playwright-smoke.yml"
  workflow_dispatch:

concurrency:
  group: chromium-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/softmaple
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/softmaple
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Web and Collab
        run: pnpm turbo run build --filter=@softmaple/web --filter=@softmaple/collab-nitro
      - name: Install Chromium
        run: pnpm --filter @softmaple/web exec playwright install --with-deps chromium
      - name: Run public-surface smoke
        run: pnpm --filter @softmaple/web exec playwright test public.spec.ts --project=chromium
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-smoke-traces
          path: apps/web/test-results/
          retention-days: 7
