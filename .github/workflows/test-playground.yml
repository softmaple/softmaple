name: Test "@softmaple/playground" app

on:
  push:
    paths:
      - 'apps/playground/**/*.ts'
      - 'apps/playground/**/*.tsx'
      - 'apps/playground/**/*.test.ts'
      - 'apps/playground/**/*.test.tsx'
      - 'apps/playground/package.json'
      - 'apps/playground/vite.config.*'
      - 'apps/playground/vitest.config.*'
      - 'apps/playground/workspace-aliases.ts'
      - 'apps/playground/tsconfig.json'
      - 'apps/playground/src/**'
      - 'packages/eg-walker/**'
      - '!packages/eg-walker/src/test/**'
      - '!packages/eg-walker/**/*.test.ts'
      - '!packages/eg-walker/**/*.test.tsx'
      - '!packages/eg-walker/coverage/**'
      - '!packages/eg-walker/**/*.md'
      - 'packages/awareness/**'
      - '!packages/awareness/src/test/**'
      - '!packages/awareness/**/*.test.ts'
      - '!packages/awareness/**/*.test.tsx'
      - '!packages/awareness/coverage/**'
      - '!packages/awareness/**/*.md'
  pull_request:
    paths:
      - 'apps/playground/**/*.ts'
      - 'apps/playground/**/*.tsx'
      - 'apps/playground/**/*.test.ts'
      - 'apps/playground/**/*.test.tsx'
      - 'apps/playground/package.json'
      - 'apps/playground/vite.config.*'
      - 'apps/playground/vitest.config.*'
      - 'apps/playground/workspace-aliases.ts'
      - 'apps/playground/tsconfig.json'
      - 'apps/playground/src/**'
      - 'packages/eg-walker/**'
      - '!packages/eg-walker/src/test/**'
      - '!packages/eg-walker/**/*.test.ts'
      - '!packages/eg-walker/**/*.test.tsx'
      - '!packages/eg-walker/coverage/**'
      - '!packages/eg-walker/**/*.md'
      - 'packages/awareness/**'
      - '!packages/awareness/src/test/**'
      - '!packages/awareness/**/*.test.ts'
      - '!packages/awareness/**/*.test.tsx'
      - '!packages/awareness/coverage/**'
      - '!packages/awareness/**/*.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run unit tests

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # No upstream `pnpm --filter @softmaple/eg-walker build` step needed —
      # the playground's `workspace-aliases.ts` resolves workspace packages
      # straight to source for dev, build, typecheck, and test runs.

      # Build runs first because TanStack Router's `src/routeTree.gen.ts`
      # is gitignored and generated by the Vite plugin at build time. The
      # subsequent `tsc --noEmit` imports it via `@/routeTree.gen`, so the
      # typecheck step needs the artifact to exist.
      - name: Build
        run: pnpm --filter @softmaple/playground build

      - name: Typecheck
        run: pnpm --filter @softmaple/playground typecheck

      - name: Run unit tests
        run: pnpm --filter @softmaple/playground test --run
