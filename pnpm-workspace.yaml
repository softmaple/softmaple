packages:
  - "docs"
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  core-js-pure: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react@7.37.5>eslint": "10"
