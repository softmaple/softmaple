name: Test "@softmaple/web" app

on:
  push:
    paths:
      - 'apps/web/**/*.ts'
      - 'apps/web/**/*.tsx'
      - 'apps/web/**/*.test.ts'
      - 'apps/web/**/*.test.tsx'
      - 'apps/web/package.json'
      - 'apps/web/vitest.config.*'
      - 'apps/web/utils/**'
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/modules/**'
  pull_request:
    paths:
      - 'apps/web/**/*.ts'
      - 'apps/web/**/*.tsx'
      - 'apps/web/**/*.test.ts'
      - 'apps/web/**/*.test.tsx'
      - 'apps/web/package.json'
      - 'apps/web/vitest.config.*'
      - 'apps/web/utils/**'
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/modules/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run unit tests

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm --filter @softmaple/web test --run
