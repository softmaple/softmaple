name: "Chromatic (reusable)"

# Reusable workflow that runs Chromatic for a single package.
# Callers pass the workingDir and the project-token secret to scope
# the run to one Storybook / Chromatic project.

on:
  workflow_call:
    inputs:
      working-dir:
        description: "Path to the package directory containing the Storybook"
        required: true
        type: string
      node-version:
        description: "Node.js version to install"
        required: false
        type: string
        default: "24.12.0"
    secrets:
      project-token:
        description: "Chromatic project token for this Storybook"
        required: true

permissions:
  contents: read

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    # Only run on direct pushes or PRs from the same repository (not forks)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.project-token }}
          workingDir: ${{ inputs.working-dir }}
          # Only upload and test if the working dir changed
          onlyChanged: true
          # Skip if no Storybook changes detected
          exitZeroOnChanges: true
