name: Isolated Supabase E2E

on:
  workflow_dispatch:

concurrency:
  group: isolated-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Core product E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: apps/web-e2e
    env:
      CI: true
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.E2E_DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ALLOW_REMOTE_SEED: "true"
      E2E_SEED_SECRET: ${{ secrets.E2E_SEED_SECRET }}
      E2E_SUPABASE_PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply forward migrations
        run: pnpm --filter @softmaple/db db:deploy
      - name: Verify database security structure
        run: pnpm --filter @softmaple/db db:verify:collab-security
      - name: Verify RLS and RPC behavior
        run: pnpm --filter @softmaple/db db:verify:core-behavior
      - name: Build Web and Collab
        run: pnpm turbo run build --filter=@softmaple/web --filter=@softmaple/collab-nitro
      - name: Install Chromium
        run: pnpm --filter @softmaple/web exec playwright install --with-deps chromium
      - name: Run real product E2E
        run: pnpm --filter @softmaple/web exec playwright test core.spec.ts --project=chromium
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: isolated-e2e-report
          path: apps/web/playwright-report/
          retention-days: 14
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-e2e-traces
          path: apps/web/test-results/
          retention-days: 7
