name: Playwright Tests

on:
  workflow_dispatch: # Temporarily disabled - manual trigger only
  # push:
  #   branches: [ main, next ]
  #   paths:
  #     - 'apps/web/**'
  #     - 'packages/**'
  #     - '.github/workflows/playwright.yml'
  #     - 'pnpm-lock.yaml'
  #     - 'turbo.json'
  # pull_request:
  #   branches: [ main, next ]
  #   paths:
  #     - 'apps/web/**'
  #     - 'packages/**'
  #     - '.github/workflows/playwright.yml'
  #     - 'pnpm-lock.yaml'
  #     - 'turbo.json'

# Concurrency control - only one Playwright test suite (smoke or E2E) runs at a time globally
# New runs will wait in queue behind the currently running one
concurrency:
  group: playwright-global  # Shared group with smoke tests
  cancel-in-progress: false  # Queue new runs, don't cancel

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Use 6 shards for balanced parallelization
        # With ~50 active tests, this gives ~8-9 tests per shard
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CI: true
      # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      # TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Playwright browsers
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      # Cache Next.js build output
      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/web/.next/standalone
            apps/web/.next/static
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/**', 'packages/**') }}

      - name: Run database migrations for E2E tests
        working-directory: packages/db
        run: pnpm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.E2E_DIRECT_URL }}

      - name: Build apps/web
        run: pnpm --filter @softmaple/web build
        env:
          CI: true
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.E2E_DIRECT_URL }}
          LIVEBLOCKS_SECRET_KEY: ${{ secrets.LIVEBLOCKS_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_E2E_TEST_MODE: true
          # Skip Next.js telemetry during build
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install Playwright Browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
        working-directory: apps/web
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --project=chromium
        env:
          CI: true
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.E2E_DIRECT_URL }}
          LIVEBLOCKS_SECRET_KEY: ${{ secrets.LIVEBLOCKS_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_E2E_TEST_MODE: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7

  # Merge reports from all shards
  merge-reports:
    name: Merge Test Reports
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-shard-*
          merge-multiple: true
          path: all-reports/

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: all-reports/
          retention-days: 30
