name: E2E Tests "@softmaple/playground" app

on:
  workflow_dispatch:

# Concurrency control - cancel old runs within the same PR when new commits arrive
# Different PRs can run in parallel
concurrency:
  group: playground-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true  # Cancel old runs when new commits arrive in the same PR

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Run Playwright E2E tests
    environment:
      name: e2e-tests
      url: ${{ github.event.pull_request.html_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.8
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter @softmaple/playground exec playwright install chromium --with-deps

      - name: Build eg-walker
        run: pnpm --filter @softmaple/eg-walker build

      - name: Run E2E tests
        run: pnpm --filter @softmaple/playground test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/playground/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-screenshots
          path: apps/playground/test-results/
          retention-days: 7
